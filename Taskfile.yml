version: "3"

tasks:
  desktop:
    desc: Run an existing desktop task (task desktop -- dev)
    dir: apps/desktop
    cmd: task {{.CLI_ARGS}}
  android:build:
    desc: Build the Android debug APK
    dir: apps/android
    cmd: ./gradlew assembleDebug
  android:test:
    desc: Run Android terminal unit tests and lint
    dir: apps/android
    cmd: ./gradlew testDebugUnitTest lintDebug
  android:device-test:
    desc: Run PTY and lifecycle tests on a connected Android device
    dir: apps/android
    cmd: ./gradlew connectedDebugAndroidTest
