name: Android
on:
  push:
    paths: ["apps/android/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["apps/android/**", ".github/workflows/android.yml"]
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    working-directory: apps/android
env:
  # Uses the Android SDK preinstalled on GitHub's Ubuntu runners ($ANDROID_HOME).
  SDK_PACKAGES: platforms;android-36 build-tools;36.0.0 ndk;28.2.13676358
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" $SDK_PACKAGES
      - run: ./gradlew assembleDebug testDebugUnitTest lintDebug --console=plain
      - uses: actions/upload-artifact@v5
        with:
          name: waddle-android-debug
          path: apps/android/app/build/outputs/apk/debug/app-debug.apk
  device-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" $SDK_PACKAGES
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          working-directory: apps/android
          script: ./gradlew connectedDebugAndroidTest --console=plain
      - name: Annotate device test failures
        if: failure()
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          for path in glob.glob("app/build/outputs/androidTest-results/connected/**/*.xml", recursive=True):
              for case in ET.parse(path).getroot().iter("testcase"):
                  for bad in list(case.iter("failure")) + list(case.iter("error")):
                      detail = (bad.get("message") or bad.text or "").strip().splitlines()[:6]
                      print(f"::error title={case.get('name')}::" + " | ".join(detail)[:900])
          PY
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: android-device-test-results
          path: apps/android/app/build/reports/androidTests/
